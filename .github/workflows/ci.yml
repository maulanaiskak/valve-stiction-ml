name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
        # test_classic_real_fixtures.py skips gracefully if data/raw/ isn't
        # populated (the thesis CSVs aren't committed here) -- no separate
        # data-fetch step needed for CI to pass.
